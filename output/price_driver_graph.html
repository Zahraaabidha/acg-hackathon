        <script type="text/javascript">

              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#e8734a", "font": {"color": "#222222"}, "id": "crude_oil_price", "label": "crude_oil_price", "shape": "dot", "size": 22, "title": "crude_oil_price\ncategory: feedstock"}, {"color": "#4a78e8", "font": {"color": "#222222"}, "id": "usd_inr_rate", "label": "usd_inr_rate", "shape": "dot", "size": 22, "title": "usd_inr_rate\ncategory: currency"}, {"color": "#9e9e9e", "font": {"color": "#222222"}, "id": "freight_index", "label": "freight_index", "shape": "dot", "size": 22, "title": "freight_index\ncategory: logistics"}, {"color": "#1f9e89", "font": {"color": "#222222"}, "id": "energy_price_index", "label": "energy_price_index", "shape": "dot", "size": 22, "title": "energy_price_index\ncategory: energy"}, {"color": "#c0392b", "font": {"color": "#222222"}, "id": "pvc_resin_price", "label": "pvc_resin_price", "shape": "dot", "size": 38, "title": "pvc_resin_price\ncategory: target"}, {"color": "#2c5aa0", "font": {"color": "#222222"}, "id": "aluminium_price", "label": "aluminium_price", "shape": "dot", "size": 38, "title": "aluminium_price\ncategory: target"}]);
                  edges = new vis.DataSet([{"arrows": "to", "dashes": false, "from": "crude_oil_price", "title": "1-month lagged crude oil price feeds naphtha cost, PVC resin\u0027s primary feedstock\ncorrelation: +0.79 (1-month lag)\nused as model feature", "to": "pvc_resin_price", "value": 8.11}, {"arrows": "to", "dashes": false, "from": "crude_oil_price", "title": "same-month crude oil price correlates with aluminium price via energy/production cost\ncorrelation: +0.70 (same-month)\nused as model feature", "to": "aluminium_price", "value": 7.3}, {"arrows": "to", "dashes": false, "from": "usd_inr_rate", "title": "a weaker rupee raises the cost of dollar-denominated aluminium/alumina imports; stays strongly correlated through a 6-month lag\ncorrelation: +0.66 (6-month lag)\nused as model feature", "to": "aluminium_price", "value": 6.94}, {"arrows": "to", "dashes": true, "from": "freight_index", "title": "higher freight rates raise the landed cost of imported PVC resin\ncorrelation: +0.33 (same-month)\nqualitative only - not a model feature", "to": "pvc_resin_price", "value": 3.97}, {"arrows": "to", "dashes": true, "from": "freight_index", "title": "higher freight rates raise the landed cost of imported aluminium\ncorrelation: +0.18 (same-month)\nqualitative only - not a model feature", "to": "aluminium_price", "value": 2.62}, {"arrows": "to", "dashes": false, "from": "energy_price_index", "title": "aluminium smelting is energy-intensive; US electric power PPI (FRED PCU221122221122) correlates with aluminium price same-month\ncorrelation: +0.67 (same-month)\nused as model feature", "to": "aluminium_price", "value": 7.066000000000001}]);

                  nodeColors = {};

                  for (nodeId in allNodes) {

                  allEdges = edges.get({ returnType: "Object" });

                  var options = {

            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,

};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
